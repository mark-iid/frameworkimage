---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/kb3lyb-sway
name: kb3lyb-sway
description: Framework 13 AMD, niri, minimal

# Fedora Sway Atomic. Note: the old "sericea" codename repo is gone; the image
# now lives at fedora-ostree-desktops/sway-atomic. Pinned explicitly per DESIGN §5;
# never point at a floating tag. Currently matches the Fedora 44 the machine runs
# today. Bumped by an automated PR (see §5), never floating.
base-image: quay.io/fedora-ostree-desktops/sway-atomic
image-version: 44

# Building up per DESIGN §9. Done: files, codecs, niri/greetd session (§9.3),
# hardware+userland+VS Code layer (§9.5). $HOME installers (brew/SDKMAN/JetBrains)
# are NOT baked (DESIGN §2) — they come via the dotfiles bootstrap in §9.6.
modules:
  - type: files
    files:
      - source: system
        destination: /

  # Codecs: RPM Fusion + ffmpeg swap + freeworld VA driver. Most fragile module;
  # kept in common/codecs.yml and smoke-tested in isolation via codec-test.yml.
  - from-file: common/codecs.yml

  # Session stack (DESIGN §9.3). All in Fedora 44 repos (verified). Baked config
  # for these lives under files/system/etc (niri, waybar, mako, foot, greetd).
  - type: dnf
    install:
      packages:
        # compositor + XWayland
        - niri
        - xwayland-satellite
        # greeter
        - greetd
        - tuigreet
        # bar / notifications / launcher
        - waybar
        - mako
        - fuzzel
        # screenshot / clipboard / screen lock / display profiles
        - grim
        - slurp
        - wl-clipboard      # niri config uses wl-paste/wl-copy for cliphist
        - cliphist
        - gtklock
        - kanshi
        # fallback terminal. ghostty (below) is the primary terminal now; foot
        # stays as a tiny, dependency-light backup that always launches.
        - foot
        # polkit agent — base ships none; niri needs one for auth prompts.
        # polkit-gnome is retired in F44; mate-polkit is the lightweight GTK agent
        # (ships /usr/libexec/polkit-mate-authentication-agent-1).
        - mate-polkit
        # session niceties
        - brightnessctl
        - playerctl
        - blueman
        - network-manager-applet

  # Clipboard persistence. wlroots/niri drop the active selection when the source
  # window closes, so copying a URL from a short-lived dialog (e.g. the Nextcloud
  # login prompt) and then pasting into Firefox yields nothing. wl-clip-persist
  # keeps the last selection alive so paste works. wl-clipboard/cliphist (above)
  # cover copy + history but NOT live persistence. Unlike those, wl-clip-persist is
  # NOT in the Fedora repos — only a COPR — so this is a deliberate, documented
  # exception to the minimize-external-repos rule (§1), scoped to this one package.
  # Autostarted from the niri config (dotfiles): wl-clip-persist --clipboard both.
  - type: dnf
    repos:
      copr:
        - leloubil/wl-clip-persist
    install:
      packages:
        - repo: copr:copr.fedorainfracloud.org:leloubil:wl-clip-persist
          packages:
            - wl-clip-persist

  # ghostty — primary terminal (DESIGN §2), replacing the foot interim. GTK4 +
  # Wayland-native, so it honors the 1.35 fractional scale directly (no dpi-aware
  # dance like foot needed). Not in Fedora repos yet; scottames/ghostty is the COPR
  # ghostty's own install docs endorse — the vetted source the DESIGN §3 note was
  # waiting on (its `pgdev/ghostty` guess never existed). Another scoped §1
  # external-repo exception. Config + the Super+Return binding live in dotfiles.
  - type: dnf
    repos:
      copr:
        - scottames/ghostty
    install:
      # Plain package, NOT the scoped `repo: copr:…` form: ghostty pulls zlib-ng
      # (and gtk4-layer-shell) as deps, and zlib-ng lives in the Fedora repo, not
      # the COPR. The scoped form restricts resolution to the COPR only, so the
      # build fails with "nothing provides zlib-ng". Enabling the COPR (above) and
      # listing ghostty plainly lets deps resolve from Fedora + the COPR together.
      # (wl-clip-persist can use the scoped form because it has no external deps.)
      packages:
        - ghostty

  # Icon font for the desktop UI. waybar (and its style.css) render status glyphs
  # from Nerd Fonts' Material Design Icon set — battery/network/volume/backlight.
  # With no icon font installed they all fall back to tofu placeholders (□). This
  # installs "Symbols Nerd Font" — exactly the family style.css asks for. Done via
  # the BlueBuild fonts module (fetched from the upstream Nerd Fonts release), not
  # a font RPM: the symbols-only Nerd Font isn't in the Fedora repos (only the
  # third-party Terra repo / a COPR), and pulling it here keeps the external-repo
  # surface minimal (§1).
  - type: fonts
    fonts:
      nerd-fonts:
        - NerdFontsSymbolsOnly

  # Hardware + userland + VS Code (DESIGN §9.5). Only VS Code needs an external
  # repo — tailscale, VPN, rclone, fprintd are all in Fedora now, keeping the
  # external-repo surface (the thing that breaks on version bumps, §1) minimal.
  # NOT added: power-profiles-daemon — the base ships tuned-ppd, which provides
  # the same PPD D-Bus API and would conflict.
  - type: dnf
    repos:
      keys:
        - https://packages.microsoft.com/keys/microsoft.asc
      files:
        - vscode.repo   # -> files/dnf/vscode.repo
    install:
      packages:
        - code                              # VS Code (MS repo), layered per §2
        - tailscale                         # now in Fedora; no external repo
        - wireguard-tools
        - openconnect                       # Cisco AnyConnect via openconnect (§2)
        - NetworkManager-openconnect-gnome
        - rclone
        - fuse3                             # rclone FUSE mounts (§1)
        - fprintd
        - fprintd-pam                       # fingerprint; enabled via authselect below
        - stow                              # dotfiles deploy (DESIGN §6/§9.6)
        - zsh                               # login shell the dotfiles/.zshrc target (§6);
                                            # kb3lyb-bootstrap ends by telling you to open zsh

  # Evolution (mail) — the one GUI app layered NATIVE rather than a flatpak (the
  # §8.5 default). Native gives reliable Microsoft 365 / Graph OAuth against the
  # system Secret Service keyring and keeps the evolution-ews backend out of the
  # flatpak sandbox. evolution-ews provides the "Microsoft 365" account type (plain
  # EWS is being retired by Microsoft). New-mail alerts go through mako via
  # Evolution's built-in Mail Notification plugin; the SNI tray plugin was declined
  # (would need a custom in-image build stage + tracks Evolution's ABI — not worth
  # the maintenance). Both in Fedora repos; no external repo.
  - type: dnf
    install:
      packages:
        - evolution
        - evolution-ews

  # GUI apps as flatpaks (DESIGN §8.5: prefer $HOME/flatpak over layering/overrides).
  # Electron apps (slack/discord/bitwarden) are forced onto native Wayland for
  # sharp HiDPI via seeded flatpak overrides — see files/.../factory + the
  # tmpfiles.d C rules (DESIGN §4). Bazaar (app store) still deferred: not in
  # Fedora, flatpak ID unverified (§7).
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - io.github.ungoogled_software.ungoogled_chromium
          - com.bitwarden.desktop
          - com.nextcloud.desktopclient.nextcloud
          - com.slack.Slack
          - com.discordapp.Discord
          - org.libreoffice.LibreOffice
          - com.valvesoftware.Steam
      - scope: user

  # Enable fingerprint auth via authselect (DESIGN §2/§7).
  - type: script
    scripts:
      - authselect-fingerprint.sh

  # Display manager: base SDDM -> greetd. Plus tailscaled (§2) and the auto-update
  # timers (§5). Unit files for the flatpak/brew timers live in files/systemd/.
  # fprintd is NOT enabled here: it's D-Bus-activated (no [Install] section), so
  # enabling would error; PAM starts it on demand once with-fingerprint is set.
  #
  # Update strategy (§5): rpm-ostreed-automatic stages OS updates (policy=stage in
  # /etc/rpm-ostreed.conf), flatpak-update.timer refreshes SYSTEM flatpaks (system,
  # not user — a user flatpak update would hit polkit and stall), and the per-user
  # brew-upgrade.timer keeps $HOME brew current. Together these replace Aurora's uupd.
  - type: systemd
    system:
      enabled:
        - greetd.service
        - tailscaled.service
        - rpm-ostreed-automatic.timer
        - flatpak-update.timer
      disabled:
        - sddm.service
    user:
      enabled:
        - brew-upgrade.timer

  - type: signing
