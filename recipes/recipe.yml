---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/kb3lyb-sway
name: kb3lyb-sway
description: Framework 13 AMD, niri, minimal

# Fedora Sway Atomic. Note: the old "sericea" codename repo is gone; the image
# now lives at fedora-ostree-desktops/sway-atomic. Pinned explicitly per DESIGN §5;
# never point at a floating tag. Currently matches the Fedora 44 the machine runs
# today. Bumped by an automated PR (see §5), never floating.
base-image: quay.io/fedora-ostree-desktops/sway-atomic
image-version: 44

# Building up per DESIGN §9. Done: files, codecs, niri/greetd session (§9.3),
# hardware+userland+VS Code layer (§9.5). $HOME installers (brew/SDKMAN/JetBrains)
# are NOT baked (DESIGN §2) — they come via the dotfiles bootstrap in §9.6.
modules:
  # NOTE: the `files` module is deliberately NOT first — see the block just above
  # the `script` module below for why. Package installs come first.

  # Codecs: RPM Fusion + ffmpeg swap + freeworld VA driver. Most fragile module;
  # kept in common/codecs.yml and smoke-tested in isolation via codec-test.yml.
  - from-file: common/codecs.yml

  # Session stack (DESIGN §9.3). All in Fedora 44 repos (verified). Baked config
  # for these lives under files/system/etc (niri, waybar, mako, foot, greetd).
  - type: dnf
    install:
      packages:
        # compositor + XWayland
        - niri
        - xwayland-satellite
        # greeter
        - greetd
        - tuigreet
        # bar / notifications / launcher
        - waybar
        - mako
        - fuzzel
        # screenshot / clipboard / screen lock / display profiles
        - grim
        - slurp
        - wl-clipboard      # niri config uses wl-paste/wl-copy for cliphist
        - cliphist
        - gtklock
        - kanshi
        # fallback terminal. ghostty (below) is the primary terminal now; foot
        # stays as a tiny, dependency-light backup that always launches.
        - foot
        # polkit agent — base ships none; niri needs one for auth prompts.
        # polkit-gnome is retired in F44; mate-polkit is the lightweight GTK agent
        # (ships /usr/libexec/polkit-mate-authentication-agent-1).
        - mate-polkit
        # wtype — virtual-keyboard text injection (niri implements the
        # zwp_virtual_keyboard protocol it uses). The voice dictation tooling
        # (dotfiles: bin/voice-dictate, provisioned by bin/voice-setup) types
        # transcribed speech into the focused window with it; also handy for any
        # host-side "paste as keystrokes" scripting.
        - wtype
        # session niceties
        - brightnessctl
        - playerctl
        - blueman
        - network-manager-applet

  # Clipboard persistence. wlroots/niri drop the active selection when the source
  # window closes, so copying a URL from a short-lived dialog (e.g. the Nextcloud
  # login prompt) and then pasting into Firefox yields nothing. wl-clip-persist
  # keeps the last selection alive so paste works. wl-clipboard/cliphist (above)
  # cover copy + history but NOT live persistence. Only in a COPR (not Fedora), so
  # a deliberate, documented exception to the minimize-external-repos rule (§1).
  # Installed as a PLAIN package (not the scoped `repo: copr:…` form) so any deps
  # resolve from Fedora too — same reason as ghostty below. It has no external deps
  # today, but the plain form keeps it from breaking the build if it ever gains one.
  # Autostarted from the niri config (dotfiles): wl-clip-persist --clipboard both.
  - type: dnf
    repos:
      copr:
        - leloubil/wl-clip-persist
    install:
      packages:
        - wl-clip-persist

  # ghostty — primary terminal (DESIGN §2), replacing the foot interim. GTK4 +
  # Wayland-native, so it honors the 1.35 fractional scale directly (no dpi-aware
  # dance like foot needed). Not in Fedora repos yet; scottames/ghostty is the COPR
  # ghostty's own install docs endorse — the vetted source the DESIGN §3 note was
  # waiting on (its `pgdev/ghostty` guess never existed). Another §1 external-repo
  # exception. Config + the Super+Return binding live in dotfiles.
  - type: dnf
    repos:
      copr:
        - scottames/ghostty
    install:
      # Plain package, NOT the scoped `repo: copr:…` form: ghostty pulls zlib-ng
      # (and gtk4-layer-shell) as deps, and zlib-ng lives in the Fedora repo, not
      # the COPR. The scoped form restricts resolution to the COPR only, so the
      # build fails with "nothing provides zlib-ng". Enabling the COPR (above) and
      # listing ghostty plainly lets deps resolve from Fedora + the COPR together.
      # (wl-clip-persist above uses the plain form too, for the same reason.)
      packages:
        - ghostty

  # Icon font for the desktop UI. waybar (and its style.css) render status glyphs
  # from Nerd Fonts' Material Design Icon set — battery/network/volume/backlight.
  # With no icon font installed they all fall back to tofu placeholders (□). This
  # installs "Symbols Nerd Font" — exactly the family style.css asks for. Done via
  # the BlueBuild fonts module (fetched from the upstream Nerd Fonts release), not
  # a font RPM: the symbols-only Nerd Font isn't in the Fedora repos (only the
  # third-party Terra repo / a COPR), and pulling it here keeps the external-repo
  # surface minimal (§1).
  - type: fonts
    fonts:
      nerd-fonts:
        - NerdFontsSymbolsOnly

  # Hardware + userland + VS Code (DESIGN §9.5). Only VS Code needs an external
  # repo — tailscale, VPN, rclone, fprintd are all in Fedora now, keeping the
  # external-repo surface (the thing that breaks on version bumps, §1) minimal.
  # NOT added: power-profiles-daemon — the base ships tuned-ppd, which provides
  # the same PPD D-Bus API and would conflict.
  - type: dnf
    repos:
      keys:
        - https://packages.microsoft.com/keys/microsoft.asc
      files:
        - vscode.repo   # -> files/dnf/vscode.repo
    install:
      packages:
        - code                              # VS Code (MS repo), layered per §2
        - tailscale                         # now in Fedora; no external repo
        - wireguard-tools
        - openconnect                       # Cisco AnyConnect via openconnect (§2)
        - NetworkManager-openconnect-gnome
        # Wi-Fi survey pair, for checking AP placement around the house. wavemon
        # is the ncurses live signal/noise/SNR meter with a scrolling histogram
        # (walk the house, watch dBm) plus an AP scan screen; `iw`, already in the
        # base, covers one-shot `iw dev wlp1s0 link|scan` dumps for scripting.
        # iperf3 is the other half and not optional: dBm and usable throughput
        # diverge badly at range, so a room that reads -65 can still have a
        # collapsed MCS rate. It only measures against a peer — run `iperf3 -s`
        # on a wired box, not on this laptop. Matters more than usual here because
        # the MT7922 associates on 6 GHz (160 MHz wide), which penetrates walls
        # noticeably worse than 5 GHz. Both plain Fedora 44 packages, no new repo.
        - wavemon
        - iperf3
        # kismet — monitor-mode survey, for neighbor APs and channel congestion
        # across all bands. Not a flatpak and can't sensibly be one: it captures
        # on the raw interface through setuid-root helper binaries, which is the
        # exact thing the sandbox exists to stop. Not on Flathub either (checked).
        #
        # Single radio, so monitor mode DROPS the wifi association — kismet and a
        # working connection are mutually exclusive on this machine. That's why
        # wavemon above is the tool for "how is my AP reaching this room" and
        # kismet is for "what else is on the air"; they don't substitute.
        #
        # SECURITY, and the reason this package is not free: it ships its capture
        # helpers setuid root and WORLD-EXECUTABLE (0104755 root:root) —
        # kismet_cap_linux_wifi, _linux_bluetooth, _nrf_*, _ti_cc_*, _rz_killerbee,
        # _hak5_wifi_coconut. The rpm creates a `kismet` group via
        # /usr/lib/sysusers.d/kismet.conf and then doesn't gate the wifi helper on
        # it. Only the niche ones (_sdr_*, _radiacode_usb, _serial_radview,
        # _freaklabs_zigbee) are 0104550 root:root, i.e. root-only. So installing
        # this hands every local uid a setuid-root NIC-manipulation binary.
        # Single-user laptop, so the blast radius is small, but it is a real
        # widening of the suid surface and is NOT mitigated by anything already in
        # this image. Fix is a build-time chmod to 0750 root:kismet (see §1) —
        # deliberately not done yet, tracked rather than silently assumed.
        - kismet
        # Network diagnostics that pair with the survey tools above. All checked
        # for suid/caps the same way kismet was; findings noted per package.
        - mtr        # continuous traceroute+ping; separates "the wifi link is bad"
                     # from "the ISP is bad" at a glance. cap_net_raw=ep on
                     # /usr/bin/mtr-packet — capability, not setuid root.
        - fping      # scriptable multi-host ping, for logging loss/jitter per room
                     # alongside the dBm reading. cap_net_raw=ep on the binary.
        - bmon       # live per-interface throughput graphs. No suid, no caps.
        - nmap       # LAN device discovery. No suid, no caps.
        # wireshark-cli (tshark) — packet-level wifi debugging: retries, deauths,
        # beacon intervals, and it reads kismet's monitor-mode captures. Included
        # because its packaging is what kismet's should have been: /usr/bin/dumpcap
        # is 0750 root:wireshark with cap_net_admin,cap_net_raw=ep — NOT world
        # executable, NOT setuid root, and gated on a `wireshark` group that
        # sysusers.d actually creates and uses. Nothing to harden here.
        # tshark itself is plain 0755 and reads saved captures with no privilege.
        # Live capture as non-root needs: usermod -aG wireshark <user>.
        - wireshark-cli
        # Storage health: SMART attributes, wear level, self-tests. No suid and no
        # file caps — smartctl just needs sudo, which is correct for something
        # issuing raw ATA/SCSI passthrough.
        #
        # The rpm also ships smartd.service; it is deliberately NOT enabled in the
        # systemd module below. smartd's default failure action is to mail root,
        # and there is no MTA on this machine, so alerts would go nowhere and read
        # as "monitored" while being silently dropped. Wiring it to mako instead
        # needs a custom -M exec script; do that deliberately or not at all.
        #
        # For the USB expansion card specifically, SMART has to be tunnelled
        # through the bridge: `sudo smartctl -a -d sat /dev/sda`, falling back to
        # `-d scsi`. Plenty of USB bridges pass no SMART at all, so this may
        # legitimately return nothing useful for /var/mnt/data — internal nvme0n1
        # needs no -d flag and always works.
        - smartmontools
        # rpi-imager — SD card / USB writer for Raspberry Pi images. A DELIBERATE
        # §8.5 exception: that section prefers flatpaks for GUI apps, and this one
        # is layered native, for the same class of reason Evolution is.
        #
        #   * Fedora ships 2.0.6; Flathub is still on 1.9.6.
        #   * It writes RAW BLOCK DEVICES. Sandboxing it would mean granting
        #     broad device access anyway, which gives up most of what the sandbox
        #     was buying — and the flatpak-override route is exactly what produced
        #     the silent, hard-to-bisect Discord breakage documented below.
        #   * The rpm is clean: no suid, no file caps, 2.5 MB.
        #
        # HOW TO ACTUALLY RUN IT:  sudo -E rpi-imager
        #
        # -E matters: it preserves WAYLAND_DISPLAY and XDG_RUNTIME_DIR so the Qt
        # GUI can still attach to the niri session once it is root.
        #
        # It does NOT elevate itself, despite carrying pkexec/polkit machinery.
        # Launched normally it prints "Not running with elevated privileges -
        # device access may fail" and then fails at write time with "Cannot open
        # storage device". The rpm ships no polkit action, only a .desktop.
        #
        # v2.x offers an "Install Authorization" button that writes its own
        # .policy into /usr/share/polkit-1/actions to set up automatic elevation.
        # That CANNOT work here: /usr is read-only on ostree, so the button fails.
        # Baking the action into the image is possible in principle, but the
        # action id is built at runtime from a format string and is not readable
        # from the binary, so it has not been guessed at. sudo -E is the
        # supported fallback and is what the binary itself tells you to use.
        #
        # CARE REQUIRED WHEN USING IT: this laptop's /var/mnt/data lives on a
        # USB-attached Framework expansion card, so it shows up in rpi-imager's
        # target list right next to the SD card, ~1TB and full of real data.
        # Picking it overwrites the volume outright — no journal replay or fsck
        # gets that back. Check the device name AND size before every write.
        - rpi-imager
        # RAR extraction from Thunar. The plumbing was already there and only the
        # backend was missing: thunar-archive-plugin and xarchiver both come from
        # the sway-atomic base, xarchiver owns application/vnd.rar, and it shells
        # out to an external tool to do the work. With no such tool installed,
        # "Extract Here" just errors. Fedora's 7zip is not a fallback — its build
        # carries no RAR codec (`7z i` lists none).
        #
        # WHICH unrar THIS RESOLVES TO MATTERS. Two repos ship a package by that
        # name and they are not the same software:
        #
        #   unrar-0.3.3  Fedora          GPL-2.0-or-later, a wrapper for unrar-free
        #   unrar-7.1.7  RPM Fusion      RARLAB's own, full RAR5 support
        #                nonfree         ("Freeware with further limitations")
        #
        # Both provide /usr/bin/unrar, and 7.1.7 > 0.3.3, so version comparison
        # picks RPM Fusion's — verified with `dnf repoquery --latest-limit 1`.
        # That only holds because the codecs module runs FIRST and installs
        # rpmfusion-{free,nonfree}-release persistently (both are in the built
        # image, with their repo files enabled), so this module inherits them.
        # Reorder the modules so codecs no longer comes first and this silently
        # degrades to the unrar-free wrapper rather than failing the build —
        # check with `rpm -q unrar` on the machine, which should say 7.1.7.
        #
        # Nonfree, deliberately, and consistent with the codecs already layered
        # from the same repo. `unar` (LGPL, Fedora, multi-format) is the free
        # alternative and xarchiver knows how to drive it, but it is the weaker
        # option for RAR specifically.
        - unrar
        # C/C++ toolchain. The image had NO compiler at all — no cc, gcc, clang,
        # make, ld — which is a bigger hole than it looks:
        #
        #   * C is one of the languages this machine is actually used for.
        #   * nvim-treesitter COMPILES its parsers, so with no cc it silently
        #     degrades every language to no syntax highlighting, indentation or
        #     structural selection ("Unmet requirements for nvim-treesitter: ❌ C
        #     compiler"). That is how this was found.
        #   * Mason (the Neovim LSP/DAP installer, in $HOME per §2) builds some of
        #     its tools from source and fails the same way.
        #
        # In the image rather than brew because a compiler is a system capability,
        # not a per-user tool — the §2 split puts language runtimes and personal
        # tooling in $HOME, but the toolchain they all build against belongs here.
        #
        # clang-tools-extra is what provides /usr/bin/clangd, the C language server
        # (verified with `dnf repoquery --whatprovides`), so it earns its place
        # beyond just being a second compiler. gdb covers debugging; nvim-dap
        # drives it for both C and, via java-debug, Java.
        - gcc
        - gcc-c++
        - make
        - cmake
        - ninja-build
        - pkgconf
        - clang-tools-extra           # clangd — C/C++ language server
        - gdb
        # nmtui — curses front end for NetworkManager. In the image rather than
        # brew because it configures the SYSTEM NetworkManager, so it belongs
        # beside network-manager-applet above rather than in $HOME (§2).
        # Earns its place as the fallback path: when niri/waybar are not up, or
        # the applet is not cooperating, this is how wifi gets fixed from a bare
        # console — which is exactly the situation the AP survey work kept
        # landing in.
        - NetworkManager-tui
        - rclone
        - fuse3                             # rclone FUSE mounts (§1)
        - fprintd
        - fprintd-pam                       # fingerprint; enabled via authselect below
        - stow                              # dotfiles deploy (DESIGN §6/§9.6)
        - zsh                               # login shell the dotfiles/.zshrc target (§6);
                                            # kb3lyb-bootstrap ends by telling you to open zsh

  # Evolution (mail) — the one GUI app layered NATIVE rather than a flatpak (the
  # §8.5 default). Native gives reliable Microsoft 365 / Graph OAuth against the
  # system Secret Service keyring and keeps the evolution-ews backend out of the
  # flatpak sandbox. evolution-ews provides the "Microsoft 365" account type (plain
  # EWS is being retired by Microsoft). New-mail alerts go through mako via
  # Evolution's built-in Mail Notification plugin; the SNI tray plugin was declined
  # (would need a custom in-image build stage + tracks Evolution's ABI — not worth
  # the maintenance). Both in Fedora repos; no external repo.
  - type: dnf
    install:
      packages:
        - evolution
        - evolution-ews

  # GUI apps as flatpaks (DESIGN §8.5: prefer $HOME/flatpak over layering/overrides).
  # Electron apps (slack/bitwarden/discord) are forced onto native Wayland for sharp
  # HiDPI via seeded flatpak overrides — see files/.../factory + the tmpfiles.d C
  # rules (DESIGN §4).
  #
  # Discord IS a flatpak again (2026-08-08), and it must have NO flatpak override
  # — see the note in files/.../tmpfiles.d/kb3lyb-flatpak-overrides.conf.
  #
  # The "zypak breaks the Wayland splash->main-window handoff under niri" bug that
  # justified the native tarball was never zypak. It was a stale
  # /var/lib/flatpak/overrides/com.discordapp.Discord left over from an earlier
  # image revision. Any override on this app — even sockets alone — puts the
  # renderer in a segfault loop showing a stuck "Discord Updater" splash. Remove
  # the override and it maps a normal main window, on Wayland, unaided.
  #
  # Bisected on the live machine rather than reasoned about: no-override works,
  # sockets-only breaks, full override breaks, and re-applying the override to a
  # known-good install reproduces the break on demand.
  #
  # This matters beyond tidiness: the native tarball was the only app on the
  # machine with NO sandbox at all, it self-updated by downloading and exec'ing a
  # client into ~/.config/discord with no signature check, and it opened an RPC
  # listener on 127.0.0.1:6463 reachable by any local process. The flatpak has
  # none of those properties.
  #
  # Bazaar is the app store (no GNOME Software on this minimal image); flatpak ID
  # verified as io.github.kolunmi.Bazaar on Flathub.
  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - io.github.ungoogled_software.ungoogled_chromium
          - com.bitwarden.desktop
          - com.nextcloud.desktopclient.nextcloud
          - com.slack.Slack
          - com.discordapp.Discord
          - io.github.dweymouth.supersonic   # Navidrome/Subsonic music client (native, lightweight)
          - org.libreoffice.LibreOffice
          - com.valvesoftware.Steam
          - io.github.kolunmi.Bazaar   # app store (Flathub)
          # Daily & comms
          - net.cozic.joplin_desktop   # Notes — bound to Mod+N in the niri config (dotfiles)
          - org.videolan.VLC
          - us.zoom.Zoom
          - com.github.IsmaelMartinez.teams_for_linux   # Teams (unofficial, better Wayland than the web app)
          # System utilities
          - com.github.tchx84.Flatseal          # flatpak permission editor
          - com.github.wwmm.easyeffects         # audio EQ / effects
          - io.missioncenter.MissionCenter      # graphical system monitor
          - org.gnome.Firmware                  # fwupd GUI (firmware updates)
          - org.remmina.Remmina                 # RDP/VNC remote desktop
          # Creative & CAD
          - org.blender.Blender
          - org.gimp.GIMP
          - org.audacityteam.Audacity
          - org.freecad.FreeCAD
          - com.orcaslicer.OrcaSlicer           # 3D-print slicer (Framework/hobby)
          - org.godotengine.Godot
          - cc.arduino.IDE2                     # Arduino IDE
          - fr.handbrake.ghb                    # HandBrake video transcoder
          # Dev & docs
          - org.eclipse.Java                    # Eclipse IDE
          - org.texstudio.TeXstudio             # LaTeX editor
          - com.usebruno.Bruno                  # API client (Postman-like)
          - com.abisource.AbiWord
          - org.gnome.Boxes                     # GNOME Boxes (local VMs)
          - com.hamrick.VueScan                 # scanner software
      - scope: user
        install:
          - org.gnome.seahorse.Application      # keyring/GNOME Keyring GUI (Seahorse)

  # Baked config files (files/system -> /). MUST RUN AFTER EVERY dnf MODULE.
  #
  # This used to be the first module, which silently lost files. Module order is
  # build order, so anything copied here that a LATER rpm also owns gets
  # overwritten by that rpm — quietly, with no build error. Confirmed the hard
  # way with /etc/pam.d/gtklock: `rpm -qc gtklock` lists no config files, so the
  # path is not %config(noreplace) and the rpm simply replaced our version. The
  # image built green and the file was just... the package default.
  #
  # /etc/greetd/config.toml and /etc/niri/config.kdl only survived that ordering
  # by luck: those paths ARE %config(noreplace), so rpm kept ours and dropped its
  # own as .rpmnew (there is a /etc/greetd/config.toml.rpmnew on the machine
  # proving it). Relying on which upstream packages happen to mark their config
  # correctly is not a strategy.
  #
  # Running last makes our copy authoritative regardless. It must still come
  # BEFORE the `systemd` module below, which enables unit files that this module
  # is what installs (kb3lyb-power-profile.timer, flatpak-update.timer,
  # kb3lyb-console-font.service).
  - type: files
    files:
      - source: system
        destination: /

  # Scope fingerprint auth via authselect (DESIGN §2/§7). After `files`, since the
  # fingerprint PAM stack it reasons about is /etc/pam.d/gtklock from above.
  - type: script
    scripts:
      - authselect-fingerprint.sh
      # Narrow kismet's setuid-root capture helpers from world-executable to
      # 4750 root:kismet. Order-independent of `files` (it only touches /usr/bin
      # paths the rpm owns), but it MUST come after the dnf module above — the
      # script hard-fails if kismet is absent rather than silently no-opping.
      # Needs a per-machine follow-up: usermod -aG kismet <user>.
      - kismet-suid-scope.sh

  # Display manager: base SDDM -> greetd. Plus tailscaled (§2) and the auto-update
  # timers (§5). Unit files for the flatpak/brew timers live in files/systemd/.
  # fprintd is NOT enabled here: it's D-Bus-activated (no [Install] section), so
  # enabling would error; PAM starts it on demand once with-fingerprint is set.
  #
  # Update strategy (§5): rpm-ostreed-automatic stages OS updates (policy=stage in
  # /etc/rpm-ostreed.conf), flatpak-update.timer refreshes SYSTEM flatpaks (system,
  # not user — a user flatpak update would hit polkit and stall), and the per-user
  # brew-upgrade.timer keeps $HOME brew current. Together these replace Aurora's uupd.
  - type: systemd
    system:
      enabled:
        - greetd.service
        - kb3lyb-console-font.service   # re-set the big HiDPI console font after
                                        # vconsole-setup (installer's /etc/vconsole.conf
                                        # otherwise masks the baked FONT= default)
        - tailscaled.service
        - rpm-ostreed-automatic.timer
        - flatpak-update.timer
        - kb3lyb-power-profile.timer   # auto power profile: perf on AC, balanced on
                                       # battery, power-saver <20% (files/.../usr/bin
                                       # + udev rule + polkit rule)
        - kb3lyb-usb-retrain.service   # warm reboots leave the Framework expansion
                                       # card on the USB 2.0 companion port (480 Mb/s
                                       # vs 10 Gb/s) ~3 boots in 4; cold boots never
                                       # do. Power-cycles the hub port to force a
                                       # SuperSpeed retrain. Ordered BEFORE
                                       # systemd-cryptsetup@data.service — that
                                       # ordering is the safety mechanism, since
                                       # yanking the port under the mounted ext4
                                       # corrupts its journal. No-ops on cold boots.
      disabled:
        - sddm.service
    user:
      enabled:
        - brew-upgrade.timer

  - type: signing
