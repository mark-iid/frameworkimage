---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# DESIGN §9 task 2: the codec module ALONE, to confirm it depsolves on Fedora 44
# before it's entangled with everything else. This is the most fragile module and
# the one expected to break on a version bump (§7), so it's kept as a standalone
# smoke test the version-bump workflow (§5) can build to catch codec breakage
# early. The actual module lives in common/codecs.yml (shared with recipe.yml).
#   TAG=kb3lyb-codec-test:44 ./build-local.sh recipes/codec-test.yml
name: kb3lyb-codec-test
description: codec depsolve smoke test

base-image: quay.io/fedora-ostree-desktops/sway-atomic
image-version: 44

modules:
  - type: files
    files:
      - source: system
        destination: /

  - from-file: common/codecs.yml
