# kb3lyb-sway console font/keymap (applied by systemd-vconsole-setup at boot, so
# it affects the text boot messages AND the tuigreet login on VT1).
#
# The Framework 13 panel is ~200 DPI, so the stock 16px console font renders
# microscopic — unreadable for a login screen. latarcyrheb-sun32 is a 16x32 glyph
# (double the height/width of the default 8x16), which roughly doubles the on-screen
# text size. It ships in the base image (kbd consolefonts), so no layering needed.
# KEYMAP stays "us" to match the niri xkb layout.
KEYMAP="us"
FONT="latarcyrheb-sun32"
