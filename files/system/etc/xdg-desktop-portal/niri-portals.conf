# kb3lyb-sway portal routing for the niri session (DESIGN §6).
#
# Overrides the stock /usr/share/xdg-desktop-portal/niri-portals.conf, whose
# `default=gnome;gtk` sends the FileChooser (and other UI portals) to
# xdg-desktop-portal-gnome FIRST. Under niri there is no GNOME session, so
# xdg-desktop-portal-gnome's FileChooser delegation fails ("The name is not
# activatable") and the CALLING app hangs on an open/save dialog that never
# appears (seen with the Nextcloud desktop client: "Choose a different folder"
# did nothing, then the app froze).
#
# Prefer the GTK backend, which implements FileChooser and every other UI portal
# and works on wlroots compositors; keep screenshot on the wlroots backend and
# secrets on gnome-keyring. Dark mode still flows through the GTK Settings
# portal (reads org.gnome.desktop.interface color-scheme).
#
# ScreenCast is the exception that goes to gnome. xdg-desktop-portal-wlr can
# only offer a whole output, so Teams/Meet cannot share a single window. niri
# owns org.gnome.Mutter.ScreenCast (verify: `busctl --user list | grep Mutter`),
# which is exactly the interface xdg-desktop-portal-gnome's ScreenCast backend
# drives, and upstream niri lists that backend as REQUIRED for screencasting.
# This is delegation-safe in a way FileChooser was not: the implementation is
# niri itself, not an absent GNOME session.
#
# Screenshot stays on wlr on purpose: xdg-desktop-portal-gnome's Screenshot
# backend wants org.gnome.Shell.Screenshot, which niri does NOT own, so routing
# it to gnome would reintroduce the hang above. The RemoteDesktop portal is
# likewise unavailable (no org.gnome.Mutter.RemoteDesktop owner), so screen
# sharing works but remote input control — Teams "give control" — does not.
[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.ScreenCast=gnome
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.Secret=gnome-keyring
