# Seed system flatpak overrides into /var on boot (DESIGN §4: force the Electron
# apps onto native Wayland for sharp HiDPI). Baking directly into /var doesn't
# persist on ostree/bootc, so these `C` rules copy the seed from
# /usr/share/factory/var/... into /var only if the target doesn't already exist —
# leaving any later `flatpak override` edits by the user untouched.
d /var/lib/flatpak/overrides 0755 root root - -
C /var/lib/flatpak/overrides/com.slack.Slack 0644 root root - -
C /var/lib/flatpak/overrides/com.bitwarden.desktop 0644 root root - -
