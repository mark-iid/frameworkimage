# Retry the default-flatpaks first-boot install until it succeeds.
#
# The unit is ordered After=network-online.target, but that does not mean the
# network is usable on a fresh install: NetworkManager reports online with no
# wifi configured yet, because the wifi password is entered after first login.
# On the 2026-10-11 reinstall it ran at 17:43, failed in a fraction of a second on
# "Could not resolve hostname" for dl.flathub.org, and left the laptop with zero
# flatpaks. The timer is OnBootSec= only, so nothing tried again until the next
# boot. The user unit has the same problem; see its own copy of this drop-in.
#
# Backoff from 30s to 15min, never giving up (StartLimitIntervalSec=0). The script
# is idempotent (remote-add --if-not-exists, install skips what is present), so a
# retry after a partial install is safe. A failure that is NOT network-related, such
# as a dead app ID in the recipe, also retries forever, but at the 15min cap and
# with every attempt logged: `systemctl status system-flatpak-setup` shows it.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=30s
RestartSteps=6
RestartMaxDelaySec=15min
