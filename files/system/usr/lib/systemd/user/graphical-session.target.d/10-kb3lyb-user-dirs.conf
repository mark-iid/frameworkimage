# Run xdg-user-dirs-update with the session. Upstream hangs it off
# graphical-session-pre.target, which nothing starts here: greetd runs a bare
# `niri --session` rather than niri.service (DESIGN §6), so only
# graphical-session.target comes up. Without this ~/.config/user-dirs.dirs
# never existed after the 2026-10-11 install, XDG_DOWNLOAD_DIR fell back to
# $HOME, and Flatpak's xdg-download grant exposed nothing. Firefox then saved
# into a tmpfs inside its sandbox that vanished when it closed.
[Unit]
Wants=xdg-user-dirs.service
