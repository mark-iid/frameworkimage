# Start XDG autostart entries (/etc/xdg/autostart, ~/.config/autostart) with the
# session. niri.service does this itself (Wants=/Before=xdg-desktop-autostart
# .target), but greetd runs a bare `niri --session` (DESIGN §6), so without this
# nothing in autostart ever ran: JetBrains Toolbox's "start at login", for one,
# and blueman-applet, the Bluetooth pairing agent.
#
# Entries niri already spawns, or that make no sense on bare metal, are hidden
# with Hidden=true copies in /etc/xdg/autostart (nm-applet, vboxclient,
# vmware-user). Before adding a package with an autostart entry, check whether
# it would duplicate a spawn-at-startup line.
[Unit]
Wants=xdg-desktop-autostart.target
Before=xdg-desktop-autostart.target
