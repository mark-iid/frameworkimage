# Retry the default-flatpaks per-user setup until it succeeds. Same failure and
# same fix as the system unit; the full reasoning is in
# /usr/lib/systemd/system/system-flatpak-setup.service.d/10-kb3lyb-retry.conf.
#
# This one needs its own retry. Its After=system-flatpak-setup.service does
# nothing: the user manager cannot see system units, so it does not wait for the
# system install and fails offline on its own (2026-10-11, 17:43:03, one second
# after the system unit).
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=30s
RestartSteps=6
RestartMaxDelaySec=15min
